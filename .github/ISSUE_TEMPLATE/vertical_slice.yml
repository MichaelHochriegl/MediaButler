name: Feature slice
description: Implement a complete vertical feature slice
title: "[Slice]: "
labels:
  - type:feature-slice
  - status:ready
body:
  - type: checkboxes
    id: affected_modules
    attributes:
      label: Affected modules
      description: Select all modules this slice touches.
      options:
        - label: Libraries
        - label: Movies
        - label: TV Shows
        - label: Scanning
        - label: Virtual Libraries
        - label: Scan Reports
        - label: UI
        - label: Infrastructure
        - label: Documentation
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Describe what the user can do after this slice is completed.
      placeholder: |
        Example:
        User can create a physical library from the UI and see it in the libraries overview.
    validations:
      required: true

  - type: textarea
    id: done_when
    attributes:
      label: Done when
      description: Describe the observable completion criteria.
      placeholder: |
        Example:
        - Entity persisted correctly
        - Endpoint implemented
        - UI implemented
        - Validation rules applied
        - Unit tests included
        - Integration tests included
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Describe what is included in this slice.
      placeholder: |
        Example:
        - Physical library creation only
        - API + UI parity required
        - Persistence included
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Describe what is intentionally excluded.
      placeholder: |
        Example:
        - Scan execution
        - Virtual libraries
        - Metadata parsing
    validations:
      required: false

  - type: textarea
    id: implementation_notes
    attributes:
      label: Implementation notes
      description: Optional technical notes, architectural constraints, or reminders.
    validations:
      required: false