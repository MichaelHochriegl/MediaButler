name: Bug report
description: Report a reproducible problem or regression.
title: "[Bug]: "
labels:
  - type:bug
  - status:needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Please describe the issue as clearly as possible.

        Questions or usage help belong in Discussions instead.

  - type: checkboxes
    id: affected_modules
    attributes:
      label: Affected modules
      description: Select all modules that seem relevant.
      options:
        - label: Libraries
        - label: Movies
        - label: TV Shows
        - label: Scanning
        - label: Virtual Libraries
        - label: Scan Reports
        - label: UI
        - label: Infrastructure
        - label: Documentation
        - label: Not sure
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues to avoid duplicates.
          required: true
        - label: I included reproduction steps below.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version(s)
      placeholder: e.g. v0.3.0

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low
        - Medium
        - High
        - Critical

  - type: textarea
    id: additional
    attributes:
      label: Additional context